<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CK Trading Bot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1 { margin-top: 0; font-size: 20px; color: #38bdf8; text-align: center; }
    .balance-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }
    .balance-title { font-size: 12px; color: #94a3b8; }
    .balance-value { font-size: 22px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #94a3b8; }
    input, select {
      width: 100%; padding: 10px; margin-top: 6px;
      border-radius: 6px; border: 1px solid #334155;
      background-color: #0f172a; color: #fff; box-sizing: border-box;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-rise {
      flex: 1; padding: 12px; border-radius: 6px; border: none;
      background-color: #10b981; color: #0f172a; font-weight: bold;
      font-size: 16px; cursor: pointer;
    }
    .btn-fall {
      flex: 1; padding: 12px; border-radius: 6px; border: none;
      background-color: #ef4444; color: #fff; font-weight: bold;
      font-size: 16px; cursor: pointer;
    }
    .btn-reset {
      width: 100%; padding: 8px; margin-top: 12px;
      border-radius: 6px; border: 1px solid #475569;
      background: transparent; color: #38bdf8; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-connected { color: #34d399; font-weight: bold; margin-top: 12px; text-align: center; }
    .status-error { color: #f87171; font-weight: bold; margin-top: 12px; text-align: center; }
    .note { font-size: 12px; color: #94a3b8; margin-top: 12px; text-align: center; }
  </style>

  <!-- Load official Deriv API wrapper via Skypack CDN -->
  <script type="module">
    import DerivAPIBasic from 'https://cdn.skypack.dev/@deriv/deriv-api/dist/DerivAPIBasic';

    const appId = 1089;
    let api;
    let connection;

    window.initBot = async function() {
      const token = localStorage.getItem('deriv_token');
      if (!token) {
        document.getElementById('status').className = 'status-error';
        document.getElementById('status').innerText = 'No API Token found. Click below to add.';
        return;
      }

      document.getElementById('status').className = 'note';
      document.getElementById('status').innerText = 'Connecting via Deriv API...';

      try {
        connection = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);
        api = new DerivAPIBasic({ connection });

        connection.onopen = async () => {
          document.getElementById('status').innerText = 'Authorizing session...';
          try {
            const authResponse = await api.authorize(token.trim());
            if (authResponse.error) {
              document.getElementById('status').className = 'status-error';
              document.getElementById('status').innerText = 'Auth Error: ' + authResponse.error.message;
              return;
            }

            document.getElementById('status').className = 'status-connected';
            document.getElementById('status').innerText = 'Connected & Ready';
            const acc = authResponse.authorize;
            document.getElementById('balance').innerText = `${acc.balance} ${acc.currency}`;

            document.getElementById('riseBtn').disabled = false;
            document.getElementById('fallBtn').disabled = false;

            // Keep connection alive with a ping interval every 30 seconds
            setInterval(() => {
              if (connection.readyState === WebSocket.OPEN) {
                api.ping().catch(() => {});
              }
            }, 30000);

            // Subscribe to live balance stream
            await api.balance({ balance: 1, subscribe: 1 });
            connection.addEventListener('message', (msg) => {
              const data = JSON.parse(msg.data);
              if (data.msg_type === 'balance' && data.balance) {
                document.getElementById('balance').innerText = `${data.balance.balance} ${data.balance.currency}`;
              }
            });

          } catch (err) {
            document.getElementById('status').className = 'status-error';
            document.getElementById('status').innerText = 'Authorization failed.';
          }
        };

        connection.onclose = () => {
          document.getElementById('riseBtn').disabled = true;
          document.getElementById('fallBtn').disabled = true;
          document.getElementById('status').className = 'note';
          document.getElementById('status').innerText = 'Connection lost. Reconnecting in 3s...';
          setTimeout(window.initBot, 3000);
        };

      } catch (e) {
        document.getElementById('status').className = 'status-error';
        document.getElementById('status').innerText = 'Initialization error.';
      }
    };

    window.placeTrade = async function(contractType) {
      if (!api || connection.readyState !== WebSocket.OPEN) {
        document.getElementById('status').innerText = 'Socket not connected.';
        return;
      }

      const symbol = document.getElementById('symbol').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const duration = parseInt(document.getElementById('duration').value);

      document.getElementById('status').className = 'note';
      document.getElementById('status').innerText = 'Submitting trade proposal...';

      try {
        const proposalReq = {
          proposal: 1,
          amount: amount,
          basis: 'stake',
          contract_type: contractType,
          currency: 'USD',
          duration: duration,
          duration_unit: 't',
          symbol: symbol
        };

        const proposal = await api.proposal(proposalReq);
        if (proposal.error) {
          document.getElementById('status').className = 'status-error';
          document.getElementById('status').innerText = 'Proposal Error: ' + proposal.error.message;
          return;
        }

        document.getElementById('status').innerText = 'Executing buy order...';
        const buyResponse = await api.buy({ buy: proposal.proposal.id, price: proposal.proposal.ask_price });

        if (buyResponse.error) {
          document.getElementById('status').className = 'status-error';
          document.getElementById('status').innerText = 'Buy Error: ' + buyResponse.error.message;
          return;
        }

        document.getElementById('status').className = 'status-connected';
        document.getElementById('status').innerText = `Trade Success! ID: ${buyResponse.buy.contract_id}`;
      } catch (err) {
        document.getElementById('status').className = 'status-error';
        document.getElementById('status').innerText = 'Trade transaction failed.';
      }
    };

    window.resetToken = function() {
      const newToken = prompt("Paste your fresh Deriv API Token:");
      if (newToken) {
        localStorage.setItem('deriv_token', newToken.trim());
        location.reload();
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.initBot();
    });
  </script>
</head>
<body>

  <div class="card">
    <h1>CK Trading Bot</h1>

    <div class="balance-box">
      <div class="balance-title">Account Balance</div>
      <div id="balance" class="balance-value">--.--</div>
    </div>

    <label>Market</label>
    <select id="symbol">
      <option value="R_100">Volatility 100 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_10">Volatility 10 Index</option>
    </select>

    <label>Trade amount (USD)</label>
    <input id="amount" type="number" value="1" min="0.35" step="0.01">

    <label>Trade duration (ticks)</label>
    <select id="duration">
      <option value="1">1 tick</option>
      <option value="5">5 ticks</option>
      <option value="10">10 ticks</option>
    </select>

    <div class="btn-group">
      <button id="riseBtn" class="btn-rise" onclick="window.placeTrade('CALL')" disabled>Rise ↗</button>
      <button id="fallBtn" class="btn-fall" onclick="window.placeTrade('PUT')" disabled>Fall ↘</button>
    </div>

    <p id="status" class="note">Loading libraries...</p>

    <button class="btn-reset" onclick="window.resetToken()">Change / Re-enter API Token</button>
  </div>

</body>
</html>
