<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraderScheme - Structured Trading Workspace</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #030712; color: #ffffff; min-height: 100vh; overflow-x: hidden; }

    /* Top Market Bar & Header */
    .ticker-bar {
      background: #080d1a; border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 8px 16px; font-size: 11px; display: flex; gap: 20px; align-items: center; color: #94a3b8; overflow-x: auto; white-space: nowrap;
    }
    .ticker-bar span { color: #10b981; font-weight: 600; }
    .ticker-bar .red { color: #f43f5e; }

    header {
      width: 100%; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;
    }
    .brand-container { display: flex; flex-direction: column; }
    .brand-title { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 9px; color: #f43f5e; font-weight: 700; letter-spacing: 0.5px; }

    .header-right { display: flex; gap: 10px; align-items: center; }
    .btn-header-login {
      background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #fff;
      padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .btn-header-getstarted {
      background: #00a4ff; border: none; color: #fff;
      padding: 7px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
      box-shadow: 0 2px 10px rgba(0,164,255,0.3);
    }

    /* Hero Section */
    .hero-section { max-width: 650px; margin: 40px auto 20px auto; padding: 0 20px; text-align: center; }
    .badge-pill {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25); padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #10b981; margin-bottom: 24px;
    }
    .badge-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; }

    .hero-heading { font-size: 38px; font-weight: 900; line-height: 1.15; margin-bottom: 16px; letter-spacing: -1px; }
    .hero-heading span { color: #00a4ff; }
    .hero-p { font-size: 14px; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }

    /* Action Buttons */
    .hero-buttons { display: flex; flex-direction: column; gap: 12px; max-width: 440px; margin: 0 auto 30px auto; }
    .btn-main-blue {
      width: 100%; background: linear-gradient(135deg, #00a4ff, #0077ff); border: none; color: #fff; padding: 16px;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0,164,255,0.4);
      display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    }
    .btn-main-white {
      width: 100%; background: rgba(255,255,255,0.92); border: none; color: #030712; padding: 16px;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    }
    .explore-link { font-size: 12px; color: #64748b; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; }

    /* Info Cards Grid */
    .info-grid { max-width: 650px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (max-width: 500px) { .info-grid { grid-template-columns: 1fr; } }

    .info-card {
      background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 18px; text-align: center;
    }
    .info-card-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; color: #fff; }
    .info-card-desc { font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Dashboard Workspace View (Hidden by default until logged in) */
    #dashboardView { display: none; max-width: 800px; margin: 30px auto; padding: 0 20px; text-align: center; }
    .dash-header { margin-bottom: 30px; }
    .dash-subtitle { font-size: 11px; letter-spacing: 1px; color: #10b981; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
    .dash-title { font-size: 28px; font-weight: 900; }
    .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; text-align: left; }
    @media (max-width: 550px) { .dash-grid { grid-template-columns: 1fr; } }

    .dash-card {
      background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 24px 20px; position: relative;
    }
    .card-num { font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 12px; }
    .card-h { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .card-p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    .card-btn { color: #00a4ff; font-size: 13px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

    .account-badge {
      display: flex; align-items: center; gap: 8px; background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #10b981;
    }

      position: fixed; bottom: 24px;
