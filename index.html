<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cktradindscheme</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e1116;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #181c24;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 320px;
    }
    .btn {
      background-color: #00a4ff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #008be2;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Connect Deriv Account</h2>
    
    <!-- Login View -->
    <div id="loginView">
      <p style="font-size: 14px; color: #a0aec0; margin-bottom: 20px;">
        Log in securely with your Deriv account to start trading.
      </p>
      <button class="btn" onclick="loginWithDeriv()">Log in with Deriv</button>
    </div>

    <!-- Connected Dashboard View -->
    <div id="dashboardView" class="hidden">
      <p style="color: #48bb78; font-weight: bold;">Connected to Deriv!</p>
      <p id="accountInfo" style="font-size: 14px; color: #a0aec0; margin-bottom: 20px;"></p>
      <button class="btn" style="background-color: #e53e3e;" onclick="logoutDeriv()">Log Out</button>
    </div>
  </div>

  <script>
    // Your exact Deriv App ID
    const APP_ID = '34JjnKJzecylG5kwmjaXm'; 

    function loginWithDeriv() {
      // Direct OAuth authorization URL
      const derivOAuthUrl = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=en&brand=deriv`;
      window.location.href = derivOAuthUrl;
    }

    function handleDerivOAuthCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      
      // When user returns from Deriv with tokens in URL
      if (urlParams.has('token1')) {
        const account = urlParams.get('acct1');
        const token = urlParams.get('token1');

        // Save session locally
        localStorage.setItem('deriv_token', token);
        localStorage.setItem('deriv_account', account);

        // Remove token params from URL bar for security & cleanliness
        window.history.replaceState({}, document.title, window.location.pathname);

        showDashboard(account);
      } else {
        // Check if session exists in local storage
        const savedToken = localStorage.getItem('deriv_token');
        const savedAccount = localStorage.getItem('deriv_account');

        if (savedToken && savedAccount) {
          showDashboard(savedAccount);
        } else {
          showLogin();
        }
      }
    }

    function showDashboard(account) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('accountInfo').innerText = `Active Account: ${account}`;
      
      // Use localStorage.getItem('deriv_token') in your trading WebSocket connection
    }

    function showLogin() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('dashboardView').classList.add('hidden');
    }

    function logoutDeriv() {
      localStorage.removeItem('deriv_token');
      localStorage.removeItem('deriv_account');
      showLogin();
      window.location.href = window.location.pathname;
    }

    // Run check when page loads
    window.addEventListener('DOMContentLoaded', handleDerivOAuthCallback);
  </script>

</body>
</html>
