<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CKTrader v2.4 - Deriv Bot Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#050914',
            brandCard: '#0B132B',
            brandCardBorder: '#1C2B4B',
            brandBlue: '#00A3FF',
            brandCyan: '#00D2FF',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050914; }
    ::-webkit-scrollbar-thumb { background: #1C2B4B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00A3FF; }
  </style>
</head>
<body class="bg-brandDark text-slate-100 font-sans antialiased min-h-screen pb-12 select-none">

  <!-- TOP NAV BAR -->
  <header class="w-full bg-[#080E21] border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button class="p-1.5 rounded-lg bg-slate-800/60 text-slate-300 hover:text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brandBlue to-brandCyan flex items-center justify-center font-bold text-white text-sm shadow-md shadow-cyan-500/20">CK</div>
        <span class="font-bold tracking-tight text-white">CKTrader <span class="text-[10px] text-brandBlue px-1.5 py-0.5 rounded bg-brandBlue/10 border border-brandBlue/30">v2.4</span></span>
      </div>
    </div>

    <!-- Center Navigation Tabs -->
    <nav class="hidden md:flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs">
      <button class="px-4 py-1.5 rounded-lg font-medium bg-brandBlue/20 text-brandCyan border border-brandBlue/30">Dashboard</button>
      <button onclick="openScannerModal()" class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition">Entry Scanner</button>
      <button class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition">Bot Builder</button>
      <button class="px-4 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition flex items-center gap-1">Volt <span class="text-xs font-bold text-cyan-400">AI</span></button>
    </nav>

    <!-- Right Controls -->
    <div class="flex items-center gap-3">
      <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-slate-300 font-mono" id="navBalance">$10,000.00</span>
        <span class="text-[10px] bg-slate-800 text-slate-400 px-1 rounded">USD</span>
      </div>
      <button onclick="openScannerModal()" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-brandBlue to-brandCyan text-xs font-semibold text-white shadow-md shadow-cyan-500/20 flex items-center gap-1.5 hover:opacity-90 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Scanner
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">

    <!-- HERO HEADER CARD -->
    <div class="p-6 rounded-2xl bg-gradient-to-br from-[#0B142D] to-[#070D1E] border border-brandCardBorder shadow-xl relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-48 h-48 bg-brandBlue/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brandBlue/10 border border-brandBlue/30 text-xs text-brandCyan mb-3">
        <span class="w-2 h-2 rounded-full bg-brandCyan"></span> AUTOMATED DERIV BOT ENGINE
      </div>

      <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight mb-2">
        Structured Trading. <span class="text-transparent bg-clip-text bg-gradient-to-r from-brandBlue to-brandCyan">Zero Emotion.</span>
      </h1>
      <p class="text-slate-400 text-xs md:text-sm max-w-2xl leading-relaxed mb-6">
        Configure automated strategies for Volatility Indices, Synthetic Markets, and Forex using real-time Deriv WebSocket feeds.
      </p>

      <!-- Status Bar -->
      <div class="grid grid-cols-3 gap-3 max-w-xl bg-slate-950/60 p-3 rounded-xl border border-slate-8
