<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CK Trading Bot</title>
  <style>
    body { background-color: #0b0f19; color: #ffffff; font-family: -apple-system, sans-serif; padding: 16px; margin: 0; display: flex; justify-content: center; }
    .card { background: #162032; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #233248; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
    h2 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 20px; }
    .bal-box { background: #0e1626; padding: 14px; border-radius: 10px; text-align: center; margin-bottom: 16px; border: 1px solid #1e2d42; }
    .btn-affiliate { display: block; background: #0284c7; color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; text-align: center; margin-bottom: 16px; font-size: 13px; }
    .btn-grid { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn-trade { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 14px; }
    .rise { background: #10b981; }
    .fall { background: #ef4444; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 14px; border-radius: 8px; border: 1px solid #2c3d54; background: #0d1522; color: #fff; box-sizing: border-box; font-size: 14px; outline: none; }
    label { font-size: 12px; color: #cbd5e1; font-weight: 600; }
    #status { text-align: center; font-size: 12px; font-weight: bold; margin-top: 10px; }
    .btn-link { background: none; border: none; color: #38bdf8; font-size: 12px; text-decoration: underline; cursor: pointer; width: 100%; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>CK Trading Bot</h2>

    <div class="bal-box">
      <small style="color: #94a3b8; font-size: 10px; letter-spacing: 1px;">ACCOUNT BALANCE</small>
      <h3 id="bal" style="color: #38bdf8; margin: 4px 0 0 0; font-size: 24px;">--.--</h3>
    </div>

    <!-- Affiliate Banner -->
    <a href="https://t.deriv.link?t=JY62HWTRUYMQ" target="_blank" class="btn-affiliate">
      + Create Deriv Account (Get Started)
    </a>

    <label>Market</label>
    <select id="market">
      <option value="R_100">Volatility 100 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_10">Volatility 10 Index</option>
    </select>

    <label>Trade Amount (USD)</label>
    <input type="number" id="stake" value="1" min="0.35" step="0.5">

    <div class="btn-grid">
      <button class="btn-trade rise" onclick="trade('CALL')">Rise ↗</button>
      <button class="btn-trade fall" onclick="trade('PUT')">Fall ↘</button>
    </div>

    <div id="status" style="color: #fbbf24;">Connecting to Deriv...</div>
    <button onclick="setToken()" class="btn-link">🔑 Set / Change API Token</button>
  </div>

  <script>
    const APP_ID = "1089";
    let token = localStorage.getItem("deriv_token") || "";
    let ws = null;

    function initWS() {
      const statusEl = document.getElementById("status");
      statusEl.style.color = "#fbbf24";
      statusEl.innerText = "Connecting to Deriv...";

      ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

      ws.onopen = () => {
        if (token) {
          statusEl.innerText = "Authorizing...";
          ws.send(JSON.stringify({ authorize: token }));
        } else {
          statusEl.style.color = "#10b981";
          statusEl.innerText = "Connected! Click below to enter API Token.";
        }
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (data.msg_type === "authorize") {
          if (data.error) {
            statusEl.style.color = "#ef4444";
            statusEl.innerText = "Invalid Token";
          } else {
            statusEl.style.color = "#10b981";
            statusEl.innerText = "Connected: " + data.authorize.email;
            ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
          }
        }

        if (data.msg_type === "balance" && data.balance) {
          document.getElementById("bal").innerText = parseFloat(data.balance.balance).toFixed(2) + " " + data.balance.currency;
        }

        if (data.msg_type === "buy") {
          if (data.error) {
            alert("Trade Error: " + data.error.message);
          } else {
            alert("Trade Successful! Contract ID: " + data.buy.contract_id);
          }
        }
      };

      ws.onerror = () => {
        statusEl.style.color = "#ef4444";
        statusEl.innerText = "Connection error";
      };

      ws.onclose = () => {
        statusEl.style.color = "#ef4444";
        statusEl.innerText = "Disconnected. Reconnecting...";
        setTimeout(initWS, 3000);
      };
    }

    function trade(type) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("Connecting to server, please wait...");
        return;
      }
      if (!token) {
        alert("Please set your API token first.");
        setToken();
        return;
      }

      const market = document.getElementById("market").value;
      const stake = parseFloat(document.getElementById("stake").value) || 1;

      ws.send(JSON.stringify({
        buy: 1,
        price: stake,
        parameters: {
          amount: stake,
          basis: "stake",
          contract_type: type,
          currency: "USD",
          duration: 1,
          duration_unit: "t",
          symbol: market
        }
      }));
    }

    function setToken() {
      const input = prompt("Enter your Deriv API Token:", token);
      if (input !== null) {
        token = input.trim();
        localStorage.setItem("deriv_token", token);
        if (ws && ws.readyState === WebSocket.OPEN) {
          document.getElementById("status").innerText = "Authorizing...";
          ws.send(JSON.stringify({ authorize: token }));
        } else {
          initWS();
        }
      }
    }

    window.onload = initWS;
  </script>
</body>
</html>
