<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CK Trading Bot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1 { margin-top: 0; font-size: 20px; color: #38bdf8; text-align: center; }
    .balance-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }
    .balance-title { font-size: 12px; color: #94a3b8; }
    .balance-value { font-size: 22px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #94a3b8; }
    input, select {
      width: 100%; padding: 10px; margin-top: 6px;
      border-radius: 6px; border: 1px solid #334155;
      background-color: #0f172a; color: #fff; box-sizing: border-box;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-rise {
      flex: 1; padding: 12px; border-radius: 6px; border: none;
      background-color: #10b981; color: #0f172a; font-weight: bold;
      font-size: 16px; cursor: pointer;
    }
    .btn-fall {
      flex: 1; padding: 12px; border-radius: 6px; border: none;
      background-color: #ef4444; color: #fff; font-weight: bold;
      font-size: 16px; cursor: pointer;
    }
    .btn-reset {
      width: 100%; padding: 8px; margin-top: 12px;
      border-radius: 6px; border: 1px solid #475569;
      background: transparent; color: #38bdf8; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-connected { color: #34d399; font-weight: bold; margin-top: 12px; text-align: center; }
    .status-error { color: #f87171; font-weight: bold; margin-top: 12px; text-align: center; }
    .note { font-size: 12px; color: #94a3b8; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h1>CK Trading Bot</h1>

    <div class="balance-box">
      <div class="balance-title">Account Balance</div>
      <div id="balance" class="balance-value">--.--</div>
    </div>

    <label>Market</label>
    <select id="symbol">
      <option value="R_100">Volatility 100 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_10">Volatility 10 Index</option>
    </select>

    <label>Trade amount (USD)</label>
    <input id="amount" type="number" value="1" min="0.35" step="0.01">

    <label>Trade duration (ticks)</label>
    <select id="duration">
      <option value="1">1 tick</option>
      <option value="5">5 ticks</option>
      <option value="10">10 ticks</option>
    </select>

    <div class="btn-group">
      <button id="riseBtn" class="btn-rise" onclick="placeTrade('CALL')" disabled>Rise ↗</button>
      <button id="fallBtn" class="btn-fall" onclick="placeTrade('PUT')" disabled>Fall ↘</button>
    </div>

    <p id="status" class="note">Starting connection...</p>

    <button class="btn-reset" onclick="resetToken()">Change / Re-enter API Token</button>
  </div>

  <script>
    let ws = null;
    let retryCount = 0;

    function startBot() {
      const token = localStorage.getItem('deriv_token');
      if (!token) {
        document.getElementById('status').className = 'status-error';
        document.getElementById('status').innerText = 'Missing API token. Click button below to add.';
        return;
      }

      document.getElementById('status').className = 'note';
      document.getElementById('status').innerText = 'Opening secure socket...';

      // Using the global server fallback specifically configured for browser apps
      ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

      ws.onopen = function() {
        retryCount = 0;
        document.getElementById('status').innerText = 'Sending authorization request...';
        ws.send(JSON.stringify({ authorize: token.trim() }));
      };

      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'authorize') {
          if (data.error) {
            document.getElementById('status').className = 'status-error';
            document.getElementById('status').innerText = 'Token Rejected: ' + data.error.message;
            return;
          }
          document.getElementById('status').className = 'status-connected';
          document.getElementById('status').innerText = 'Connected & Ready';
          document.getElementById('balance').innerText = `${data.authorize.balance} ${data.authorize.currency}`;
          
          document.getElementById('riseBtn').disabled = false;
          document.getElementById('fallBtn').disabled = false;

          // Keep alive subscription
          ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
        }

        if (data.msg_type === 'balance' && data.balance) {
          document.getElementById('balance').innerText = `${data.balance.balance} ${data.balance.currency}`;
        }

        if (data.msg_type === 'proposal') {
          if (data.error) {
            document.getElementById('status').className = 'status-error';
            document.getElementById('status').innerText = 'Trade Error: ' + data.error.message;
            return;
          }
          ws.send(JSON.stringify({ buy: data.proposal.id, price: data.proposal.ask_price }));
        }

        if (data.msg_type === 'buy') {
          if (data.error) {
            document.getElementById('status').className = 'status-error';
            document.getElementById('status').innerText = 'Execution Error: ' + data.error.message;
            return;
          }
          document.getElementById('status').className = 'status-connected';
          document.getElementById('status').innerText = `Success! Contract ID: ${data.buy.contract_id}`;
        }
      };

      ws.onerror = function(err) {
        document.getElementById('status').className = 'status-error';
        document.getElementById('status').innerText = 'WebSocket security or network block detected.';
      };

      ws.onclose = function(event) {
        document.getElementById('riseBtn').disabled = true;
        document.getElementById('fallBtn').disabled = true;
        
        retryCount++;
        document.getElementById('status').className = 'note';
        document.getElementById('status').innerText = `Connection dropped (Attempt ${retryCount}). Reconnecting...`;
        
        setTimeout(startBot, 3000);
      };
    }

    function placeTrade(contractType) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        document.getElementById('status').innerText = 'Socket not active. Reconnecting...';
        return;
      }

      const symbol = document.getElementById('symbol').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const duration = parseInt(document.getElementById('duration').value);

      document.getElementById('status').className = 'note';
      document.getElementById('status').innerText = 'Placing trade...';

      ws.send(JSON.stringify({
        proposal: 1,
        amount: amount,
        basis: 'stake',
        contract_type: contractType,
        currency: 'USD',
        duration: duration,
        duration_unit: 't',
        symbol: symbol
      }));
    }

    function resetToken() {
      const newToken = prompt("Paste your fresh Deriv API Token:");
      if (newToken) {
        localStorage.setItem('deriv_token', newToken.trim());
        location.reload();
      }
    }

    startBot();
  </script>
</body>
</html>
