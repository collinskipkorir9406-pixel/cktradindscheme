<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>traderscheme - powered by deriv</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #030712; color: #ffffff; min-height: 100vh; overflow-x: hidden; }

    /* Top Bar */
    header {
      width: 100%; background: #080d1a; border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;
    }
    .brand-container { display: flex; align-items: center; gap: 10px; }
    .ck-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: #00a4ff; color: #fff;
      font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-size: 16px; font-weight: 800; }
    .brand-subtitle { font-size: 10px; color: #e11d48; font-weight: 600; }

    .nav-tabs { display: flex; gap: 8px; }
    .nav-tab {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #94a3b8; cursor: pointer;
    }
    .nav-tab.active { background: #00a4ff; color: #ffffff; border-color: #00a4ff; }

    .account-badge {
      display: flex; align-items: center; gap: 8px; background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3); padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #10b981;
    }

    /* Landing View */
    #landingView { max-width: 480px; margin: 50px auto; padding: 20px; text-align: center; }
    .hero-heading { font-size: 36px; font-weight: 900; margin-bottom: 16px; }
    .hero-heading span { color: #00a4ff; }
    .hero-p { font-size: 14px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
    .btn-login-main {
      width: 100%; background: #00a4ff; border: none; color: #fff; padding: 16px;
      border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0,164,255,0.4);
    }

    /* Dashboard Trading View */
    #dashboardView { display: none; max-width: 800px; margin: 30px auto; padding: 0 20px; text-align: center; }
    .dash-header { margin-bottom: 30px; }
    .dash-subtitle { font-size: 11px; letter-spacing: 1px; color: #10b981; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
    .dash-title { font-size: 28px; font-weight: 900; }

    .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 550px) { .dash-grid { grid-template-columns: 1fr; } }

    .dash-card {
      background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 24px 20px; text-align: left; position: relative; transition: transform 0.2s;
    }
    .dash-card:hover { transform: translateY(-2px); border-color: rgba(0, 164, 255, 0.3); }
    .card-num { font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 12px; }
    .card-h { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .card-p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    .card-btn { color: #00a4ff; font-size: 13px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

    /* AI Badge */
    .ai-badge {
      position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #3b82f6); display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 18px; box-shadow: 0 6px 24px rgba(168,85,247,0.5); cursor: pointer; z-index: 100;
    }
  </style>
</head>
