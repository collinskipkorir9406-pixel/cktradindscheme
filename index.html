<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CK Trading Bot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    h1 { margin-top: 0; font-size: 20px; color: #38bdf8; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #94a3b8; }
    input, select {
      width: 100%; padding: 10px; margin-top: 6px;
      border-radius: 6px; border: 1px solid #334155;
      background-color: #0f172a; color: #fff; box-sizing: border-box;
    }
    button {
      width: 100%; padding: 12px; margin-top: 20px;
      border-radius: 6px; border: none; background-color: #10b981;
      color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer;
    }
    button:hover { background-color: #34d399; }
    .status-connected { color: #34d399; font-weight: bold; margin-top: 12px; }
    .note { font-size: 12px; color: #94a3b8; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>CK Trading Bot</h1>

    <label>Deriv API Token</label>
    <input id="apiToken" type="password" placeholder="Paste your API Token here">

    <label>Trade amount (USD)</label>
    <input id="amount" type="number" value="1" min="0.35" step="0.01">

    <label>Trade duration (ticks)</label>
    <select id="duration">
      <option value="1">1 tick</option>
      <option value="5">5 ticks</option>
      <option value="10">10 ticks</option>
    </select>

    <button id="authBtn" onclick="saveToken()">Connect API Token</button>

    <p id="status" class="note">
      Not connected. Enter API token to proceed.
    </p>
  </div>

  <script>
    function checkAuth() {
      const savedToken = localStorage.getItem('deriv_token');
      if (savedToken) {
        document.getElementById('status').className = 'status-connected';
        document.getElementById('status').innerText = 'Connected & Ready';
        document.getElementById('authBtn').innerText = 'Connected';
        document.getElementById('authBtn').style.backgroundColor = '#475569';
        document.getElementById('apiToken').value = '••••••••••••••••';
      }
    }

    function saveToken() {
      const tokenInput = document.getElementById('apiToken').value.trim();
      if (tokenInput && !tokenInput.includes('•')) {
        localStorage.setItem('deriv_token', tokenInput);
        checkAuth();
      } else if (!tokenInput) {
        alert('Please enter a valid API token');
      }
    }

    checkAuth();
  </script>

</body>
</html>
